name: Idea or request
description: A data source, manifest format, feed option or change you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job you need done, and where Vulnder falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea, if you have one. For a new data source or lockfile format, link to it.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to send a pull request for this (see CONTRIBUTING.md)
