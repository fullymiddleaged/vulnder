# Hourly ingest for the free Workers plan, where the Worker cannot run ingest
# itself (50 subrequests, 10 ms CPU). Runs the same ingest code in Node and
# writes to the remote D1 database through Wrangler.
#
# Off unless the repository opts in, so a Paid deployment (whose Worker cron
# ingests) or a fork doesn't run it by accident. To turn it on:
#
# Repository variable:
#   INGEST_FROM_ACTIONS    "true"
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   token with D1 edit permission on the account, plus
#                          Workers AI read and edit for similar-CVE families
#                          (without them, ingest skips families)
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the D1 database
# Repository variable (unless wrangler.jsonc holds the real ID):
#   D1_DATABASE_ID         the production D1 database ID
# GITHUB_TOKEN is provided by Actions and raises the GitHub API limit.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; /api/health reports sources as stale when that happens.
#
# On Workers Paid, deploy with `npm run deploy:paid` instead and leave
# INGEST_FROM_ACTIONS unset.
name: ingest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest -- --remote --minutes 40
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
